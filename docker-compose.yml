version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: connecthousing_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-17102002}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-connectHousingDB}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - connecthousing_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-17102002}"]
      timeout: 20s
      retries: 10
      interval: 5s

  # Adminer - MySQL Web Interface
  adminer:
    image: adminer:latest
    container_name: connecthousing_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: pepa-linha
    depends_on:
      - mysql
    networks:
      - connecthousing_network

networks:
  connecthousing_network:
    driver: bridge

volumes:
  mysql_data:

